<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Чиби-котик</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#ffe8d5;
  color:#51372d;
  font-family:Arial,sans-serif;
  text-align:center;
}

main{
  max-width:720px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fffaf6;
  border-radius:25px;
  padding:16px;
  margin:14px 0;
  box-shadow:0 4px 18px #0001;
}

h1{
  font-size:38px;
  margin:10px;
}

.sub{
  font-size:18px;
  color:#82685c;
}

button,
select,
input{
  font:inherit;
}

button{
  border:0;
  border-radius:16px;
  padding:12px 15px;
  margin:5px;
  background:#ffd0c1;
  color:#51372d;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

.mainbtn{
  background:#ff7b68;
  color:white;
}

/* СЦЕНА */

#scene{
  height:430px;
  border-radius:24px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(
    #8ed7f3 0 65%,
    #77c95f 65%
  );
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

#cat{
  width:240px;
  height:315px;
  position:relative;
  z-index:3;
  transform-origin:50% 90%;
}

/* ТАНЦЫ */

.d1{
  animation:d1 .38s infinite alternate;
}

.d2{
  animation:d2 .5s infinite alternate;
}

.d3{
  animation:d3 .7s infinite alternate;
}

@keyframes d1{
  to{
    transform:translateY(-22px) rotate(-5deg);
  }
}

@keyframes d2{
  to{
    transform:translateX(28px) rotate(6deg);
  }
}

@keyframes d3{
  to{
    transform:rotate(12deg) translateY(-12px);
  }
}

/* ОДЕЖДА */

#clothes{
  position:absolute;
  inset:0;
  font-size:50px;
  z-index:5;
  pointer-events:none;
}

/* ФОН */

#sun{
  position:absolute;
  right:35px;
  top:20px;
  font-size:60px;
}

.cloud{
  position:absolute;
  font-size:55px;
}

#decor{
  position:absolute;
  inset:0;
  pointer-events:none;
  font-size:48px;
}

.deco{
  position:absolute;
}

.timer{
  font-size:22px;
  font-weight:bold;
  margin:8px;
}

.status{
  min-height:24px;
  font-weight:bold;
}

/* ПИАНИНО */

.keys{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:4px;
}

.key{
  background:white;
  border:2px solid #bfaea6;
  border-radius:10px;
  height:80px;
  padding:6px;
}

.key:active{
  background:#ffd0c1;
}

/* РИСОВАНИЕ */

#paint{
  width:100%;
  height:240px;
  border:3px dashed #c9aaa0;
  border-radius:16px;
  background:white;
  touch-action:none;
}

.row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.emoji{
  font-size:45px;
  min-height:58px;
}

audio{
  margin-top:10px;
}
</style>
</head>

<body>

<main>

<script>

"use strict";


/* =========================
   АУДИО
========================= */

let AC=null;

let rec=null;

let chunks=[];

let giveTimer=null;


const $=x=>
document.getElementById(x);


function sound(
frequency=440,
duration=.18
){

AC=AC ||
new(
window.AudioContext ||
window.webkitAudioContext
)();

let oscillator=
AC.createOscillator();

let gain=
AC.createGain();

oscillator.frequency.value=
frequency;

oscillator.type="triangle";

gain.gain.value=.07;

oscillator.connect(gain);

gain.connect(AC.destination);

oscillator.start();

gain.gain.exponentialRampToValueAtTime(
.001,
AC.currentTime+duration
);

oscillator.stop(
AC.currentTime+duration
);

}


function meow(){

sound(620,.22);

}



/* =========================
   ТАНЦЫ
========================= */

function dance(number){

clearInterval(window.danceTimer);

cat.className=
"d"+number;

let time=15;

timer.textContent=time;

status.textContent=
"Танцуем! 🎵";


let melodies={

1:[392,440,494,523,494,440],

2:[523,494,440,392,440,494],

3:[659,587,523,587,659,784]

};

let melody=
melodies[number];

let index=0;


sound(
melody[0],
.35
);


window.danceTimer=
setInterval(function(){

time--;

timer.textContent=time;

sound(
melody[index%melody.length],
.12
);

index++;


if(time<=0){

clearInterval(window.danceTimer);

cat.className="";

timer.textContent=15;

status.textContent=
"Танец закончен! 🐾";

}

},1000);

}



/* =========================
   ГАРДЕРОБ
========================= */

function dress(item){

clothes.textContent=item;

localStorage.setItem(
"clothes",
item
);

}


/* загрузка одежды */

clothes.textContent=
localStorage.getItem("clothes") ||
"";



/* =========================
   ПИАНИНО
========================= */

const notes=[
262,
294,
330,
349,
392,
440,
494,
523
];

const names=[
"До",
"Ре",
"Ми",
"Фа",
"Соль",
"Ля",
"Си",
"До"
];


notes.forEach(
function(note,index){

let button=
document.createElement("button");

button.className="key";

button.textContent=
names[index];

button.onclick=function(){

sound(
note,
.22
);

meow();

};

keys.appendChild(button);

}
);



/* =========================
   ФОН
========================= */

function bg(type){

scene.className=type;

scene.style.background="";

}


function addDecor(symbol){

let element=
document.createElement("span");

element.className="deco";

element.textContent=
symbol;

element.style.left=
(10+Math.random()*75)+"%";

element.style.top=
(20+Math.random()*60)+"%";

decor.appendChild(element);

}



/* =========================
   РИСОВАНИЕ
========================= */

const canvas=
$("paint");

const ctx=
canvas.getContext("2d");


function resizeCanvas(){

let rect=
canvas.getBoundingClientRect();

let dpr=
window.devicePixelRatio || 1;

canvas.width=
rect.width*dpr;

canvas.height=
rect.height*dpr;

ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);

}


window.addEventListener(
"resize",
resizeCanvas
);

setTimeout(
resizeCanvas,
100
);


let drawing=false;

let lastX=0;

let lastY=0;


canvas.addEventListener(
"pointerdown",
function(event){

drawing=true;

let rect=
canvas.getBoundingClientRect();

lastX=
event.clientX-rect.left;

lastY=
event.clientY-rect.top;

canvas.setPointerCapture(
event.pointerId
);

}
);


canvas.addEventListener(
"pointermove",
function(event){

if(!drawing)
return;

let rect=
canvas.getBoundingClientRect();

let x=
event.clientX-rect.left;

let y=
event.clientY-rect.top;


ctx.strokeStyle=
clr.value;

ctx.lineWidth=
Number(sz.value);

ctx.lineCap=
"round";

ctx.lineJoin=
"round";


ctx.beginPath();

ctx.moveTo(
lastX,
lastY
);

ctx.lineTo(
x,
y
);

ctx.stroke();


lastX=x;

lastY=y;

}
);


canvas.addEventListener(
"pointerup",
function(){

drawing=false;

}
);


canvas.addEventListener(
"pointercancel",
function(){

drawing=false;

}
);


function clearPaint(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}


function stamp(symbol){

ctx.font=
"36px sans-serif";

for(
let i=0;
i<7;
i++
){

ctx.fillText(
symbol,
Math.random()*
(canvas.clientWidth-40),

35+
Math.random()*
(canvas.clientHeight-45)
);

}

}



/* =========================
   ЕДА
========================= */

const foods=[

["🍦","мороженое"],
["🥧","пирог"],
["🍲","суп"],
["🍔","бургер"],
["🍭","леденец"],
["🍟","картошка фри"],
["🍣","суши"],
["🍕","пицца"],
["🥤","квас"],
["🥖","хлеб"],
["🐟","рыба"],
["🦈","акула"],
["🐡","рыба-ёж"],
["🐠","рыбка бетта"],
["🐋","синий кит"],
["🐳","косатка"],
["🦑","глубоководная рыбка"],
["🦕","динозавр"],
["🦁","лев"],
["🐆","ягуар"],
["🐈‍⬛","чёрная пантера"],
["🌮","тако"],
["🧁","кекс"],
["🍉","арбуз"],
["🍩","пончик"],
["🥭","манго"]

];


function food(){

let item=
foods[
Math.floor(
Math.random()*foods.length
)
];


$("food").textContent=
item[0];

$("foodname").textContent=
"Котик получил: "+
item[1]+
" 😋";

meow();

}



/* =========================
   ПОДАРКИ
========================= */

const gifts=[

"💍",
"💐",
"🎂",
"🪳",
"🧸",
"💌",
"🚗",
"🏠",
"🎨",
"🧩"

];


function gift(){

let item=
gifts[
Math.floor(
Math.random()*gifts.length
)
];

$("gift").textContent=
item;

$("giftmsg").textContent=
"Котик открыл подарок! 🎉";

}



/* подарок пользователю */

function give(){

clearTimeout(giveTimer);

$("gift").textContent=
"🎁";

$("giftmsg").textContent=
"Нажми на подарок за 5 секунд! ⏳";


let finished=false;


let clickHandler=
function(event){

if(
event.target.closest &&
event.target.closest("#giveBtn")
){
return;
}


if(finished)
return;


finished=true;

clearTimeout(giveTimer);

$("gift").textContent=
"✨🎁✨";

$("giftmsg").textContent=
"Подарок пойман! Котик рад 😺";

document.removeEventListener(
"click",
clickHandler
);

};


setTimeout(
function(){

document.addEventListener(
"click",
clickHandler
);

},
50
);


giveTimer=
setTimeout(
function(){

if(!finished){

$("gift").textContent=
"💨🎁";

$("giftmsg").textContent=
"Ой! Подарок улетел, котик загрустил 🥺";

document.removeEventListener(
"click",
clickHandler
);

}

},
5000
);

}



/* =========================
   МИКРОФОН
========================= */

async function record(){

try{

if(
rec &&
rec.state==="recording"
){

rec.stop();

$("micmsg").textContent=
"Готовлю запись...";

return;

}


if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"microphone"
);

}


let stream=
await navigator.mediaDevices.getUserMedia({
audio:true
});


chunks=[];


rec=
new MediaRecorder(stream);


rec.ondataavailable=
function(event){

chunks.push(
event.data
);

};


rec.onstop=
function(){

stream
.getTracks()
.forEach(
track=>track.stop()
);


let blob=
new Blob(
chunks,
{
type:"audio/webm"
}
);


$("audio").src=
URL.createObjectURL(blob);

$("audio").style.display=
"block";

$("micmsg").textContent=
"Запись готова! 🎤";

};


rec.start();

$("micmsg").textContent=
"Записываю... Нажми ещё раз.";

}

catch(error){

$("micmsg").textContent=
"Браузер не дал доступ к микрофону. Разреши микрофон.";

}

}



/* =========================
   ЗАБАВНЫЙ ГОЛОС
========================= */

function funny(){

let audio=
$("audio");


if(!audio.src){

$("micmsg").textContent=
"Сначала запиши голос.";

return;

}


const speeds=[
.65,
.8,
1.25,
1.5
];


audio.playbackRate=
speeds[
Math.floor(
Math.random()*speeds.length
)
];

audio.currentTime=0;

audio.play();

$("micmsg").textContent=
"Включён случайный забавный голос 🤖";

}

</script>
